<div class="pagina">
  <div class="pagina-header">
    <h1>Datos de la entidad</h1>
    <p>Información básica del municipio o entidad que usa el sistema</p>
  </div>

  <mat-card>
    <mat-card-content>
      <form [formGroup]="form" (ngSubmit)="guardar()" class="form-grid">

        <mat-form-field appearance="outline" class="campo-ancho">
          <mat-label>Nombre de la entidad *</mat-label>
          <input matInput formControlName="nombre" placeholder="Municipio de...">
          <mat-error>El nombre es obligatorio</mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>NIT</mat-label>
          <input matInput formControlName="nit" placeholder="800.000.000-0">
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Municipio</mat-label>
          <input matInput formControlName="municipio">
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Departamento</mat-label>
          <input matInput formControlName="departamento">
        </mat-form-field>

        <mat-form-field appearance="outline" class="campo-ancho">
          <mat-label>Dirección</mat-label>
          <input matInput formControlName="direccion" placeholder="Calle 1 # 1-01">
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Teléfono</mat-label>
          <input matInput formControlName="telefono">
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Correo institucional</mat-label>
          <input matInput formControlName="email_institucional" placeholder="contacto@municipio.gov.co">
        </mat-form-field>

        <div class="acciones campo-ancho">
          <span class="exito" *ngIf="guardado">
            <mat-icon>check_circle</mat-icon> Guardado correctamente
          </span>
          <button mat-flat-button color="primary" type="submit" [disabled]="guardando || form.invalid">
            {{ guardando ? 'Guardando...' : 'Guardar datos' }}
          </button>
        </div>

      </form>
    </mat-card-content>
  </mat-card>
</div>
