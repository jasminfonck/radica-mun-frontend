server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Angular SPA — todas las rutas apuntan a index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # No hay bloque /api/ acá a propósito: en la única topología soportada
    # (ver GestionProyecto/INSTALACION.md), todo el tráfico externo entra por
    # el servicio `proxy`, que ya intercepta /api/ antes de llegar a este
    # contenedor — `frontend` solo se alcanza en el resto de rutas (la SPA).
    # Un bloque duplicado acá sería código muerto e inalcanzable en ese flujo,
    # con el riesgo de desincronizarse silenciosamente de las cabeceras reales
    # que sí usa `proxy` (ver hallazgo 7.5 de INFORME_BUGS_Y_AJUSTES.md).
}
